<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Notificaciones</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; text-align: center; background: #f4f4f9; color: #333; }
        button { background: #007aff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        button:active { background: #0056b3; }
        #status { margin-top: 20px; font-weight: bold; color: #555; word-break: break-all; font-size: 13px; }
    </style>
</head>
<body>
    <h1>Bienvenido a tu App</h1>
    <p>Presiona el botón para activar las notificaciones personalizadas:</p>
    <button id="notifyBtn">Activar Notificaciones</button>
    <div id="status"></div>

    <script>
        // Tu llave pública VAPID integrada
        const publicVapidKey = 'B1R1Ij8UkpYDz2jk6Ghnnx8MsrUCK035czjk36ekV5wpBx655WXsl4KrWH4aWbmcpttGkT28j-mM8jHLMDiJ--M';
        const statusDiv = document.getElementById('status');

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker registrado'))
                .catch(err => console.log('Error SW:', err));
        }

        const btn = document.getElementById('notifyBtn');
        btn.addEventListener('click', async () => {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                statusDiv.textContent = 'Este navegador o dispositivo no soporta Push Notifications.';
                return;
            }

            try {
                const register = await navigator.serviceWorker.ready;
                const permission = await Notification.requestPermission();
                
                if (permission === 'granted') {
                    statusDiv.style.color = '#333';
                    statusDiv.textContent = 'Suscribiendo dispositivo...';

                    const subscription = await register.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                    });

                    statusDiv.style.color = 'green';
                    statusDiv.textContent = '¡Suscripción exitosa! Token listo.';
                    console.log(JSON.stringify(subscription));
                } else if (permission === 'denied') {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Permisos denegados en los ajustes del dispositivo.';
                } else {
                    statusDiv.style.color = 'orange';
                    statusDiv.textContent = 'Permisos cerrados sin responder.';
                }
            } catch (error) {
                statusDiv.style.color = 'red';
                statusDiv.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
