<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notificaciones MTTO - Consorcio Vial Baas</title>
    
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="icon" type="image/png" href="icono.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --subtext-color: #555555;
            --border-color: #e0e0e0;
            --history-bg: #fdfdfd;
            --item-border: #eee;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f1f1f1;
            --subtext-color: #aaaaaa;
            --border-color: #333333;
            --history-bg: #252525;
            --item-border: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
            transition: background 0.3s ease, color 0.3s ease;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            transition: background 0.3s ease;
        }
        
        /* Encabezado con Logo, Títulos y Configuración */
        .header-box {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 25px;
            padding-top: 5px;
        }

        .company-logo {
            position: absolute;
            left: 0;
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 2px;
        }

        .header-titles {
            text-align: center;
            width: 100%;
            padding-left: 50px;
            padding-right: 40px;
        }

        .company-title {
            font-size: 16px;
            font-weight: 800;
            color: #1a365d;
            margin: 0;
            letter-spacing: 0.5px;
        }
        [data-theme="dark"] .company-title { color: #90cdf4; }

        .app-subtitle {
            font-size: 14px;
            font-weight: 600;
            color: var(--subtext-color);
            margin: 4px 0 0 0;
        }

        /* Botón de Ajustes (Engranaje) */
        .settings-btn {
            position: absolute;
            right: 0;
            top: 5px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .settings-btn:hover { background: rgba(0,0,0,0.05); }

        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
            margin-bottom: 12px;
        }
        .btn:hover { background-color: #0056b3; }

        .btn-secondary {
            background-color: #dc3545;
            padding: 12px;
            font-size: 16px;
        }
        .btn-secondary:hover { background-color: #c82333; }

        .btn-sheet {
            background-color: #28a745;
            padding: 14px;
            font-size: 16px;
        }
        .btn-sheet:hover { background-color: #218838; }

        .btn-refresh {
            background-color: #6c757d;
            padding: 12px;
            font-size: 15px;
            margin-top: 10px;
        }
        .btn-refresh:hover { background-color: #5a6268; }

        #sheet-screen {
            display: none;
            margin-top: 15px;
        }

        /* Contenedor del Iframe */
        .iframe-wrapper {
            width: 100%;
            height: 60vh;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            margin-bottom: 15px;
            background: #fff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Estilos del historial local (Alertas) */
        .history-container {
            margin-top: 20px;
            background: var(--history-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: left;
        }
        .history-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 10px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
        }
        .history-item {
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid var(--item-border);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }
        .history-item-title {
            font-weight: bold;
            color: var(--text-color);
            text-transform: uppercase;
        }
        .history-item-body {
            color: var(--subtext-color);
        }
        .history-time {
            color: var(--subtext-color);
            font-size: 11px;
            align-self: flex-end;
        }

        #status { 
            margin-top: 12px; 
            font-weight: 500; 
            color: var(--subtext-color); 
            word-break: break-all; 
            font-size: 14px; 
        }

        /* Modal de Configuración */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: var(--card-bg);
            color: var(--text-color);
            padding: 25px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content h3 { margin-top: 0; color: #007bff; }
        .modal-btn {
            background-color: #f1f1f1;
            color: #333;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .modal-btn:hover { background-color: #e0e0e0; }
        [data-theme="dark"] .modal-btn { background-color: #333; color: #fff; }
        [data-theme="dark"] .modal-btn:hover { background-color: #444; }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <!-- Encabezado unificado -->
        <div class="header-box">
            <img src="icono.png" alt="Logo" class="company-logo">
            <div class="header-titles">
                <h1 class="company-title">CONSORCIO VIAL BAAS</h1>
                <p class="app-subtitle">Notificaciones MTTO</p>
            </div>
            <button class="settings-btn" onclick="abrirConfiguracion()" title="Configuración">⚙️</button>
        </div>
        
        <!-- Pantalla de Inicio -->
        <div id="home-screen">
            <button class="btn btn-sheet" onclick="mostrarHojaSheets()">📊 Ver Excavadora 1 (336 D2L)</button>
            
            <p id="instruccionesBtn" style="margin: 15px 0 10px 0; font-weight: 600; font-size: 14px;">Estado del sistema de alertas:</p>
            <button id="notifyBtn" class="btn">🔔 Activar Notificaciones</button>
            <div id="status"></div>

            <div class="history-container">
                <div class="history-title">⏱️ Historial de Alertas</div>
                <div id="lista-historial"><ul class="history-list"><li style="color:#999; text-align:center; padding: 10px;">Cargando historial...</li></ul></div>
            </div>
        </div>

        <!-- Pantalla de Google Sheets Integrada -->
        <div id="sheet-screen">
            <div class="iframe-wrapper">
                <iframe src="https://docs.google.com/spreadsheets/d/1QfoGzy5KZjKqsBLCrEGG5a-Cs5YElEmDC38fdN67chY/htmlembed?gid=700898144&widget=false&chrome=false" title="Excavadora 1 336 D2L"></iframe>
            </div>
            <button class="btn btn-secondary" onclick="ocultarHojaSheets()">Volver al Inicio</button>
        </div>
        
    </div>

    <!-- Modal de Configuración -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>⚙️ Configuración</h3>
            <button class="modal-btn" id="btnThemeToggle" onclick="alternarModoOscuro()">🌙 Cambiar a Modo Oscuro</button>
            <button class="modal-btn" onclick="verInfoApp()">ℹ️ Info de la app</button>
            <button class="modal-btn" style="background-color: #dc3545; color: white;" onclick="cerrarConfiguracion()">Cerrar</button>
        </div>
    </div>

    <script>
        const publicVapidKey = 'BN1XBI7tIkwCShqM8pv3-sDzRwODMCFFn4Rtl3yMcPJul8bXx2hZNv7IHnBLceOOfUlEbXXpUPpX9pFIc82Sg2s';
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('notifyBtn');
        const instrucciones = document.getElementById('instruccionesBtn');

        // Cargar tema guardado al iniciar
        window.onload = function() {
            cargarHistorialIndexedDB();
            const savedTheme = localStorage.getItem('theme_mode') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            actualizarTextoBotonTema(savedTheme);
        };

        function mostrarHojaSheets() {
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("sheet-screen").style.display = "block";
        }

        function ocultarHojaSheets() {
            document.getElementById("sheet-screen").style.display = "none";
            document.getElementById("home-screen").style.display = "block";
        }

        function abrirConfiguracion() {
            document.getElementById("settingsModal").style.display = "flex";
        }

        function cerrarConfiguracion() {
            document.getElementById("settingsModal").style.display = "none";
        }

        function actualizarTextoBotonTema(theme) {
            const btnTheme = document.getElementById("btnThemeToggle");
            if (theme === 'dark') {
                btnTheme.innerText = "☀️ Cambiar a Modo Claro";
            } else {
                btnTheme.innerText = "🌙 Cambiar a Modo Oscuro";
            }
        }

        function alternarModoOscuro() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme_mode', newTheme);
            actualizarTextoBotonTema(newTheme);
        }

        function verInfoApp() {
            alert("App de Notificaciones MTTO - Consorcio Vial Baas");
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function verificarSuscripcionActiva() {
            try {
                const register = await navigator.serviceWorker.ready;
                const subscription = await register.pushManager.getSubscription();
                
                if (subscription) {
                    btn.style.display = 'none';
                    if(instrucciones) instrucciones.style.display = 'none';
                    statusDiv.style.color = '#28a745'; 
                    statusDiv.textContent = '✅ Dispositivo vinculado y activo';
                }
            } catch (error) {
                console.log('Error verificando suscripción:', error);
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/notis-app/sw.js?v=7')
                .then(() => {
                    console.log('Service Worker registrado');
                    verificarSuscripcionActiva(); 
                })
                .catch(err => console.log('Error SW:', err));
        }

        function cargarHistorialIndexedDB() {
            try {
                const listaDiv = document.getElementById('lista-historial');
                const request = indexedDB.open('NotisAppDB', 1);

                request.onupgradeneeded = function(event) {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('historial')) {
                        db.createObjectStore('historial', { keyPath: 'id', autoIncrement: true });
                    }
                };

                request.onsuccess = function(event) {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('historial')) {
                        listaDiv.innerHTML = '<ul class="history-list"><li class="history-item" style="color:var(--subtext-color); align-items:center;">No hay alertas registradas aún.</li></ul>';
                        return;
                    }

                    const transaction = db.transaction('historial', 'readonly');
                    const store = transaction.objectStore('historial');
                    const getAllRequest = store.getAll();

                    getAllRequest.onsuccess = function() {
                        const registros = getAllRequest.result;
                        if (registros.length === 0) {
                            listaDiv.innerHTML = '<ul class="history-list"><li class="history-item" style="color:var(--subtext-color); align-items:center;">No hay alertas registradas aún.</li></ul>';
                            return;
                        }

                        registros.reverse(); 
                        const ultimas20 = registros.slice(0, 20);

                        let html = '<ul class="history-list">';
                        ultimas20.forEach(reg => {
                            html += `
                                <li class="history-item">
                                    <span class="history-item-title">${reg.title}</span>
                                    <span class="history-item-body">${reg.body}</span>
                                    <span class="history-time">🕒 ${reg.fecha}</span>
                                </li>
                            `;
                        });
                        html += '</ul>';
                        listaDiv.innerHTML = html;
                    };
                };
            } catch(e) {}
        }

        btn.addEventListener('click', async () => {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                statusDiv.textContent = 'Este navegador no soporta Push Notifications.';
                return;
            }

            try {
                statusDiv.style.color = 'var(--text-color)';
                statusDiv.textContent = 'Solicitando permisos...';
                
                const permission = await Notification.requestPermission();
                
                if (permission === 'granted') {
                    statusDiv.textContent = 'Cargando memoria...';

                    await navigator.serviceWorker.register('/notis-app/sw.js?v=7');
                    const register = await navigator.serviceWorker.ready;
                    
                    statusDiv.textContent = 'Conectando dispositivo...';
                    const convertedKey = urlBase64ToUint8Array(publicVapidKey);
                    const subscription = await register.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: convertedKey
                    });

                    statusDiv.textContent = 'Enviando datos al Servidor...';
                    await fetch('https://notis-server.onrender.com/subscribe', {
                        method: 'POST',
                        body: JSON.stringify(subscription),
                        headers: { 'Content-Type': 'application/json' }
                    });

                    btn.style.display = 'none';
                    if(instrucciones) instrucciones.style.display = 'none';
                    
                    statusDiv.style.color = '#28a745';
                    statusDiv.textContent = '✅ Dispositivo vinculado y activo';
                    
                    cargarHistorialIndexedDB(); 
                } else {
                    statusDiv.style.color = '#dc3545';
                    statusDiv.textContent = 'Permisos de notificación denegados.';
                }
            } catch (error) {
                statusDiv.style.color = '#dc3545';
                statusDiv.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
