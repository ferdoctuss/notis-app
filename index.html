<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Notificaciones</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <h1>Bienvenido a tu App</h1>
    <p>Presiona el botón para activar las notificaciones personalizadas:</p>
    <button id="notifyBtn">Activar Notificaciones</button>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker registrado con éxito'))
                .catch(err => console.log('Error al registrar SW:', err));
        }

        const btn = document.getElementById('notifyBtn');
        btn.addEventListener('click', async () => {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                alert('¡Permisos concedidos! Ya puedes recibir notificaciones.');
            } else {
                alert('Permisos denegados.');
            }
        });
    </script>
</body>
</html>
